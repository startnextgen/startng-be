name: Security

on:
  pull_request:
    branches: [main, prod, staging, dev]
  push:
    branches: [main, prod, staging]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # The Dockerfile runs Python 3.12. ubuntu-latest now ships 3.14, where psycopg-binary==3.2.3 has no wheel,
      # so pip-audit couldn't even install the requirements. Same pin as the pytest job (tests.yml).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pip-audit
          .venv/bin/pip-audit -r requirements.txt

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
