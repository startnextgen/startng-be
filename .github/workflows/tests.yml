name: Tests

on:
  pull_request:
    # Every PR, whatever its base (stacked PRs into a feature branch too). "edited" re-runs CI when a PR is
    # retargeted (and on title or description edits, which just run it again: skipping would hide a failure).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, prod, staging, dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 pinned SHA

      # The Dockerfile runs Python 3.12; ubuntu-latest ships it, so no extra setup action is needed.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt

      # The tests use an in-memory SQLite database and never call GitHub, so no secrets or services are needed.
      - name: Run tests
        shell: bash
        run: .venv/bin/python -m pytest -q
