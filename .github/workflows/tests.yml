name: Tests

on:
  pull_request:
    # Every PR, whatever its base (stacked PRs into a feature branch too). "edited" re-runs CI when a PR is
    # retargeted (and on title or description edits, which just run it again: skipping would hide a failure).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, prod, staging, dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4 pinned SHA

      # The Dockerfile runs Python 3.12. ubuntu-latest now ships 3.14, where
      # psycopg-binary==3.2.3 has no wheel, so pin the job to the runtime version.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 pinned SHA
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt

      # The tests use an in-memory SQLite database and never call GitHub, so no secrets or services are needed.
      - name: Run tests
        shell: bash
        run: .venv/bin/python -m pytest -q -o faulthandler_timeout=120
